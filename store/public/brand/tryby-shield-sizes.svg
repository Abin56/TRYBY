    <text x="0" y="80" fill="#888" font-family="monospace" font-size="10">USAGE</text>
    <text x="0" y="95"  fill="#555" font-family="monospace" font-size="9">Yellow on Black  →  Primary / Default</text>
    <text x="0" y="108" fill="#555" font-family="monospace" font-size="9">Black on White   →  Print / Light BG</text>
