    <rect x="0"   y="22" width="40" height="20" rx="3" fill="#F5C518"/>
    <text x="0"   y="56" fill="#666" font-family="monospace" font-size="9">#F5C518</text>
    <rect x="50"  y="22" width="40" height="20" rx="3" fill="#0D0D0D" stroke="#333" stroke-width="1"/>
    <text x="50"  y="56" fill="#666" font-family="monospace" font-size="9">#0D0D0D</text>
    <rect x="100" y="22" width="40" height="20" rx="3" fill="#FFFFFF"/>
    <text x="100" y="56" fill="#666" font-family="monospace" font-size="9">#FFFFFF</text>
    <rect x="150" y="22" width="40" height="20" rx="3" fill="#1A1A2E" stroke="#333" stroke-width="1"/>
