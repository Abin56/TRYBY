    <text x="0" y="134" fill="#555" font-family="monospace" font-size="9">Transparent      →  Jersey / Watermark</text>

    <text x="0" y="158" fill="#888" font-family="monospace" font-size="10">FILES</text>
    <text x="0" y="171" fill="#555" font-family="monospace" font-size="9">/brand/tryby-shield-yellow-on-black.svg</text>
    <text x="0" y="184" fill="#555" font-family="monospace" font-size="9">/brand/tryby-shield-black-on-white.svg</text>
  </g>
